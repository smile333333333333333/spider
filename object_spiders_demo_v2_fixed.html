<!doctype html><html><head><meta charset="utf-8"><title>Object Spiders V2</title>
<style>html,body{margin:0;overflow:hidden;background:#111;color:#fff;font:14px monospace}canvas{display:block}#ui{position:fixed;z-index:3;left:10px;top:10px;background:#000c;padding:10px;border:1px solid #777;line-height:1.5}.modal{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:#151515;border:2px solid #aaa;padding:22px;text-align:center;display:none}.modal button{font:20px monospace;margin:6px;padding:10px 18px}</style></head><body>
<div id="ui">WASD move • Mouse aim • Click shoot • E hide/interact<br>Ammo: <b id=a>18</b> | HP: <b id=h>100</b> | <span id=s>Explore</span></div>
<div id=puzzle class=modal><div id=pt>AMMO LOCKER</div><p>Solve while the game keeps running!</p><div id=choices></div></div>
<canvas id=c></canvas><script>
const C=c=document.getElementById('c'),X=C.getContext('2d');function rs(){C.width=innerWidth;C.height=innerHeight}addEventListener('resize',rs);rs();
const K={},M={x:0,y:0,down:false};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='e')act()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY});addEventListener('mousedown',()=>M.down=1);addEventListener('mouseup',()=>M.down=0);
const W=2000,H=1400,walls=[{x:0,y:0,w:2000,h:30},{x:0,y:1370,w:2000,h:30},{x:0,y:0,w:30,h:1400},{x:1970,y:0,w:30,h:1400},{x:500,y:30,w:30,h:360},{x:500,y:560,w:30,h:300},{x:500,y:1030,w:30,h:340},{x:1000,y:30,w:30,h:300},{x:1000,y:470,w:30,h:390},{x:1000,y:1040,w:30,h:330},{x:1500,y:30,w:30,h:420},{x:1500,y:570,w:30,h:800}];
const buildings=[{x:90,y:110,w:330,h:300,n:'HOUSE'},{x:590,y:170,w:320,h:280,n:'STORE'},{x:1090,y:100,w:330,h:300,n:'BARN'},{x:1580,y:180,w:300,h:300,n:'HOUSE'},{x:1080,y:900,w:350,h:330,n:'GARAGE'}];
const hides=buildings.map(b=>({x:b.x+35,y:b.y+35,w:b.w-70,h:b.h-70}));
const ammoBoxes=[{x:260,y:270,open:0},{x:730,y:310,open:0},{x:1240,y:1060,open:0}];
let P={x:260,y:650,r:13,hp:100,ammo:18,hidden:false},sp=[];
function add(x,y,size,type,shell){sp.push({x,y,size,type,shell,r:size=='small'?20:size=='medium'?31:48,legs:size=='small'?6:size=='medium'?8:10,hp:size=='small'?1:size=='medium'?4:10,broken:[],seen:false,phase:Math.random()*7,speed:size=='small'?1.15:size=='medium'?.8:.55})}
add(230,230,'small','normal','chair');add(320,300,'small','head','box');add(760,280,'medium','leg','barrel');add(1280,600,'medium','armored','cabinet');add(1680,650,'big','leg','bus');add(1770,1150,'big','head','horse');
let B=[],cool=0,over=0,puz=null;
function blocked(x,y,r){return walls.some(q=>x+r>q.x&&x-r<q.x+q.w&&y+r>q.y&&y-r<q.y+q.h)}
function inHide(){return hides.some(q=>P.x>q.x&&P.x<q.x+q.w&&P.y>q.y&&P.y<q.y+q.h)}
function act(){if(over)return;if(puz){return}if(P.hidden){P.hidden=0;s.textContent='Explore';return}if(inHide()){P.hidden=1;s.textContent='HIDDEN';return}
for(const q of ammoBoxes)if(!q.open&&Math.hypot(P.x-q.x,P.y-q.y)<55){puz=q;openPuzzle();return}}
function openPuzzle(){puz.el=1;document.getElementById('puzzle').style.display='block';let good=Math.floor(Math.random()*3),ch=document.getElementById('choices');ch.innerHTML='';for(let i=0;i<3;i++){let b=document.createElement('button');b.textContent=['▲','●','■'][i];b.onclick=()=>{if(i==good){puz.open=1;P.ammo+=12;document.getElementById('puzzle').style.display='none';puz=null}else{P.hp-=8;document.getElementById('pt').textContent='WRONG — TRY AGAIN'}};ch.appendChild(b)}}
function shoot(){if(P.ammo<=0||P.hidden||cool>0||over)return;P.ammo--;cool=.17;let dx=M.x-C.width/2,dy=M.y-C.height/2,L=Math.hypot(dx,dy)||1;let ux=dx/L,uy=dy/L;P.x-=ux*7;P.y-=uy*7;B.push({x:P.x,y:P.y,vx:ux*12,vy:uy*12})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){if(over)return;if(M.down)shoot();cool-=dt;
let dx=(K.d?1:0)-(K.a?1:0),dy=(K.s?1:0)-(K.w?1:0);if(dx||dy){let L=Math.hypot(dx,dy);dx/=L;dy/=L;let nx=P.x+dx*3,ny=P.y+dy*3;if(!blocked(nx,P.y,P.r))P.x=nx;if(!blocked(P.x,ny,P.r))P.y=ny}
for(const b of B){b.x+=b.vx;b.y+=b.vy;for(const z of sp){if(z.dead)continue;let d=dist(b,z);if(d<z.r+6){let hitLeg=false;let ang=Math.atan2(b.y-z.y,b.x-z.x);for(let i=0;i<z.legs;i++){let a=i/z.legs*Math.PI*2+Math.sin(performance.now()/250+z.phase)*.18;let ex=z.x+Math.cos(a)*(z.r+22),ey=z.y+Math.sin(a)*(z.r+22);let t=((b.x-z.x)*Math.cos(a)+(b.y-z.y)*Math.sin(a))/(z.r+22);let px=z.x+Math.cos(a)*Math.max(0,Math.min(1,t))*(z.r+22),py=z.y+Math.sin(a)*Math.max(0,Math.min(1,t))*(z.r+22);if(Math.hypot(b.x-px,b.y-py)<12){hitLeg=true;if(!z.broken.includes(i))z.broken.push(i);break}}
if(z.type=='leg'){if(hitLeg)z.hp--;else continue}else if(z.type=='armored'){if(hitLeg)z.hp--;else continue}else if(z.type=='head'){let headY=z.y-z.r*.75;if(Math.hypot(b.x-z.x,b.y-headY)<15)z.hp=0;else continue}else z.hp--;b.dead=1;if(z.hp<=0||z.broken.length>=z.legs)z.dead=1}}}B=B.filter(q=>!q.dead&&q.x>0&&q.y>0&&q.x<W&&q.y<H);
for(const z of sp){if(z.dead)continue;let d=dist(P,z);if(!P.hidden&&d<210&&!z.seen){z.seen=1;z.scream=60}if(z.seen&&!P.hidden&&d>38){z.x+=(P.x-z.x)/d*z.speed;z.y+=(P.y-z.y)/d*z.speed}if(z.seen&&!P.hidden&&d<38)P.hp-=.45}
document.getElementById('a').textContent=P.ammo;document.getElementById('h').textContent=Math.max(0,Math.floor(P.hp));if(P.hp<=0)over=1}
function drawSpider(z){for(let i=0;i<z.legs;i++){let a=i/z.legs*Math.PI*2+Math.sin(performance.now()/280+z.phase)*.16,len=z.r+28;X.strokeStyle=z.broken.includes(i)?'#292929':'#111';X.lineWidth=6;X.beginPath();X.moveTo(z.x,z.y);X.lineTo(z.x+Math.cos(a)*len,z.y+Math.sin(a)*len);X.stroke()}X.fillStyle=z.size=='small'?'#79624e':z.size=='medium'?'#635145':'#493d36';X.beginPath();X.arc(z.x,z.y,z.r,0,7);X.fill();X.fillStyle=z.shell=='box'?'#927b5b':z.shell=='barrel'?'#67462f':z.shell=='cabinet'?'#54463e':z.shell=='bus'?'#3f4544':'#6d5a45';X.fillRect(z.x-z.r*.7,z.y-z.r*.7,z.r*1.4,z.r*1.4);if(z.type=='head'){X.fillStyle='#4f6944';X.beginPath();X.arc(z.x,z.y-z.r*.8,z.r*.43,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(z.x-5,z.y-z.r*.9,3,0,7);X.arc(z.x+5,z.y-z.r*.9,3,0,7);X.fill()}}
function draw(){X.clearRect(0,0,C.width,C.height);let ox=C.width/2-P.x,oy=C.height/2-P.y;X.save();X.translate(ox,oy);X.fillStyle='#344034';X.fillRect(0,0,W,H);X.fillStyle='#4a4943';X.fillRect(30,540,1940,180);X.fillRect(920,30,180,1340);for(const b of buildings){X.fillStyle='#70675b';X.fillRect(b.x,b.y,b.w,b.h);X.strokeStyle='#171717';X.strokeRect(b.x,b.y,b.w,b.h);X.fillStyle='#222';X.fillRect(b.x+b.w/2-25,b.y+b.h-10,50,10)}for(const q of walls){X.fillStyle='#182018';X.fillRect(q.x,q.y,q.w,q.h)}for(const q of hides){X.strokeStyle='#888';X.setLineDash([6,6]);X.strokeRect(q.x,q.y,q.w,q.h);X.setLineDash([])}for(const q of ammoBoxes){if(!q.open){X.fillStyle='#d1ad55';X.fillRect(q.x-12,q.y-12,24,24);X.fillStyle='#111';X.fillText('?',q.x-4,q.y+5)}}for(const b of B){X.fillStyle='#fff';X.beginPath();X.arc(b.x,b.y,3,0,7);X.fill()}for(const z of sp)if(!z.dead)drawSpider(z);if(!P.hidden){X.fillStyle='#ddd';X.beginPath();X.arc(P.x,P.y,P.r,0,7);X.fill()}else{X.fillStyle='#aaa';X.globalAlpha=.25;X.beginPath();X.arc(P.x,P.y,22,0,7);X.fill();X.globalAlpha=1}X.restore();let scream=sp.some(z=>z.scream>0&&!z.dead);if(scream&&!P.hidden){X.fillStyle='#e33';X.font='bold 28px monospace';X.textAlign='center';X.fillText('SCREEEEEECH!',C.width/2,65)}if(over){X.fillStyle='#000d';X.fillRect(0,0,C.width,C.height);X.fillStyle='#fff';X.font='bold 46px monospace';X.textAlign='center';X.fillText('CAUGHT',C.width/2,C.height/2)}}
let last=0;function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
